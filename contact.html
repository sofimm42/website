<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Climate Control Marine</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    /* quick clean styling so it looks good immediately */
    .booking-card {
      max-width: 520px;
      margin: 30px auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .booking-card input,
    .booking-card textarea {
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .booking-card button {
      padding: 12px;
      font-size: 16px;
      background: #0077b6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .booking-card button:disabled {
      opacity: 0.6;
    }

    #status {
      font-size: 14px;
      margin-top: 5px;
    }
  </style>
</head>

<body>

  <header>
    <img src="images/logo.png" alt="Climate Control Marine Logo" class="logo">

    <nav>
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>

    <h1>Contact</h1>

    <p>Call: <a href="tel:1234567890">123-456-7890</a></p>
    <p>Email: <a href="mailto:your@email.com">your@email.com</a></p>

    <h2>Request Service</h2>

    <!-- FORM UI -->
    <div class="booking-card">

      <input type="text" id="name" placeholder="Your Name" required>

      <input type="email" id="email" placeholder="Your Email" required>

      <input type="text" id="service" placeholder="Boat / Issue" required>

      <textarea id="message" placeholder="Describe the problem..." rows="5"></textarea>

      <button onclick="sendForm()" id="btn">Send Request</button>

      <p id="status"></p>

    </div>

  </main>

  <a href="tel:1234567890" class="call-button">📞 Call Now</a>

  <!-- FAST SUBMISSION (NO PAGE RELOAD, NO FORMSPREE PAGE) -->
  <script>
    async function sendForm() {
      const btn = document.getElementById("btn");
      const status = document.getElementById("status");

      const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        service: document.getElementById("service").value,
        message: document.getElementById("message").value
      };

      if (!data.name || !data.email || !data.service) {
        status.textContent = "Please fill out required fields.";
        return;
      }

      btn.disabled = true;
      status.textContent = "Sending...";

      try {
        const res = await fetch("https://formspree.io/f/xdabbkwj", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          status.textContent = "Request sent!";

          document.getElementById("name").value = "";
          document.getElementById("email").value = "";
          document.getElementById("service").value = "";
          document.getElementById("message").value = "";

        } else {
          status.textContent = "Error sending request.";
        }

      } catch (err) {
        status.textContent = "Network error.";
      }

      btn.disabled = false;
    }
  </script>

<footer>
  <p>Climate Control Marine © 2026</p>

  <div class="socials">
    <a href="https://www.instagram.com/climatecontrolmarine/" target="_blank">
      Instagram
    </a>

    <a href="https://www.tiktok.com/@climatecontrolmarine" target="_blank">
      TikTok
    </a>
  </div>
</footer>
</body>
</html>
