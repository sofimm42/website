<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Marine Repair FL</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>

    <h1>Contact</h1>

    <p>Call: <a href="tel:1234567890">123-456-7890</a></p>
    <p>Email: <a href="mailto:your@email.com">your@email.com</a></p>

    <h2>Request Service</h2>

    <form action="https://formspree.io/f/xdabbkwj" method="POST" id="contact-form">

      <!-- Honeypot spam protection -->
      <input type="text" name="_gotcha" style="display:none">

      <input type="text" name="name" placeholder="Your Name" required>

      <input type="email" name="email" placeholder="Your Email" required>

      <input type="text" name="service" placeholder="Boat / Issue" required>

      <textarea name="message" placeholder="Describe the problem..." rows="5"></textarea>

      <button type="submit">Send Request</button>

    </form>

  </main>

  <a href="tel:1234567890" class="call-button">
    📞 Call Now
  </a>

  <!-- FIXED MOBILE-SAFE FORM HANDLER -->
  <script>
    const form = document.getElementById("contact-form");

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      const data = new FormData(form);

      try {
        const response = await fetch(form.action, {
          method: "POST",
          body: data,
          headers: {
            'Accept': 'application/json'
          }
        });

        if (response.ok) {
          // give mobile time to finish request
          setTimeout(() => {
            window.location.href = "/website/thank-you.html";
          }, 400);
        } else {
          alert("Something went wrong. Please try again.");
        }

      } catch (error) {
        alert("Network error. Please check your connection and try again.");
      }
    });
  </script>

</body>
</html>
