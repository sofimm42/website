<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Climate Control Marine</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>
    <h2>Climate Control Marine</h2>

    <nav>
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>

    <h1>Contact</h1>

    <p>Call: <a href="tel:1234567890">123-456-7890</a></p>
    <p>Email: <a href="mailto:your@email.com">your@email.com</a></p>

    <h2>Request Service</h2>

    <!-- BOOKING FORM -->
    <form id="contact-form">

      <input type="text" name="name" placeholder="Your Name" required>

      <input type="email" name="email" placeholder="Your Email" required>

      <input type="text" name="service" placeholder="Boat / Issue" required>

      <textarea name="message" placeholder="Describe the problem..." rows="5"></textarea>

      <button type="submit" id="submitBtn">Send Request</button>

      <p id="status"></p>

    </form>

  </main>

  <a href="tel:1234567890" class="call-button">📞 Call Now</a>

  <!-- FIXED FORM SCRIPT -->
  <script>
    const form = document.getElementById("contact-form");
    const status = document.getElementById("status");
    const btn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      btn.disabled = true;
      status.textContent = "Sending...";

      const data = new FormData(form);

      try {
        const res = await fetch("https://formspree.io/f/xdabbkwj", {
          method: "POST",
          body: data,
          headers: {
            "Accept": "application/json"
          }
        });

        if (res.ok) {
          form.reset();
          window.location.href = "thank-you.html";
        } else {
          status.textContent = "Something went wrong. Try again.";
        }

      } catch (err) {
        status.textContent = "Network error. Try again.";
      }

      btn.disabled = false;
    });
  </script>

</body>
</html>
